name: Validate and Package CatalogFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rapidocr
            ~/.cache/onnxruntime
          key: ${{ runner.os }}-ocr-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-ocr-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff undefined-name check
        run: |
          python -m pip install ruff
          ruff check catalogfix_core.py app.py smoke_test.py --select F821,F401,F811

      - name: Smoke test
        run: python smoke_test.py

      - name: Prepare package folder
        run: |
          mkdir -p CatalogFix_AI_v1_8_15
          cp app.py CatalogFix_AI_v1_8_15/
          cp catalogfix_core.py CatalogFix_AI_v1_8_15/
          cp smoke_test.py CatalogFix_AI_v1_8_15/
          cp requirements.txt CatalogFix_AI_v1_8_15/
          cp README.md CatalogFix_AI_v1_8_15/
          cp railway.toml CatalogFix_AI_v1_8_15/
          cp .gitignore CatalogFix_AI_v1_8_15/
          [ -f demo_messy_catalog.csv ] && cp demo_messy_catalog.csv CatalogFix_AI_v1_8_15/ || true
          RELEASE_VERSION=$(python -c "import ast; t=ast.parse(open('catalogfix_core.py',encoding='utf-8').read()); print(next(ast.literal_eval(n.value) for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='RELEASE_VERSION' for x in n.targets)))")
          CHECKPOINT_VERSION=$(python -c "import ast; t=ast.parse(open('catalogfix_core.py',encoding='utf-8').read()); print(next(ast.literal_eval(n.value) for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='CHECKPOINT_VERSION' for x in n.targets)))")
          {
            echo "GIT_SHA=$GITHUB_SHA"
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "CHECKPOINT_VERSION=$CHECKPOINT_VERSION"
            python --version
            python -m pip freeze | grep -Ei '^(rapidocr|onnxruntime|PyMuPDF|pdfplumber)==' || true
          } > CatalogFix_AI_v1_8_15/BUILD_INFO.txt

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CatalogFix_AI_v1_8_15
          path: CatalogFix_AI_v1_8_15
          if-no-files-found: error
